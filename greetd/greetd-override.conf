# Installed by greetd/install.sh as
# /etc/systemd/system/greetd.service.d/local-config.conf .
#
# Run greetd with our config rather than the packaged
# /etc/greetd/config.toml, so that package upgrades never stop to ask
# about an edited conffile.
[Service]
ExecStart=
ExecStart=/usr/sbin/greetd --config /etc/greetd/local/config.toml
