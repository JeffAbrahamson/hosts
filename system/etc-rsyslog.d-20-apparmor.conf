# Keep AppArmor audit messages together instead of duplicating them in
# syslog and kern.log.  This includes ALLOWED, DENIED, and STATUS records;
# consult /var/log/apparmor.log when investigating policy problems.
if ($syslogfacility-text == "kern" and $msg contains "apparmor=\"") then {
    action(type="omfile" file="/var/log/apparmor.log")
    stop
}
